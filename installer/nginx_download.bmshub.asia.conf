# download.bmshub.asia reverse proxy config
# default upstream port: 6655
# UpdateServer 与 Nginx 同机部署，使用 127.0.0.1 绕过防火墙，短连接模式

upstream appmanager_download_backend {
    server 127.0.0.1:6655;
    # UpdateServer 是短连接服务（Connection: close），不使用 keepalive 连接池
    # 避免 Nginx 持有失效连接导致 upstream_status=- 即时失败
}

# 自定义日志格式：记录上游地址、上游响应码，便于诊断 4xx/5xx 来源
log_format appmanager_proxy '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'upstream=$upstream_addr upstream_status=$upstream_status '
                             'rt=$request_time urt=$upstream_response_time';

# Catch-all server to detect host mismatch quickly.
server {
    listen 80 default_server;
    server_name _;

    access_log logs/default_access.log appmanager_proxy;
    error_log logs/default_error.log warn;

    return 404 '{"error":"invalid_host","hint":"use download.bmshub.asia"}';
}

server {
    listen 80;
    server_name download.bmshub.asia;

    access_log logs/download_access.log appmanager_proxy;
    error_log  logs/download_error.log warn;

    client_max_body_size 2g;

    location / {
        proxy_pass http://appmanager_download_backend;
        proxy_http_version 1.0;

        # Host 透传原始 IP:port（避免后端因 Host 头拒绝）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 短连接模式：不升级为 WebSocket，不使用 keepalive
        proxy_set_header Upgrade "";
        proxy_set_header Connection "close";

        proxy_intercept_errors off;

        # 诊断头：让客户端可以 curl 后看到 403 来自上游还是 Nginx
        add_header X-Proxy-Upstream        $upstream_addr         always;
        add_header X-Proxy-Upstream-Status $upstream_status       always;

        proxy_connect_timeout  30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 关闭 keepalive 方向的 buffering，避免大文件下载时内存压力
        proxy_buffering on;
        proxy_buffer_size        16k;
        proxy_buffers            8 64k;
        proxy_busy_buffers_size  128k;
    }
}
