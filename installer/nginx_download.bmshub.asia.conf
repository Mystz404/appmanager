# download.bmshub.asia reverse proxy config
# default upstream port: 6655

upstream appmanager_download_backend {
    server 172.18.38.179:6655;
    keepalive 32;
}

# Catch-all server to detect host mismatch quickly.
server {
    listen 80 default_server;
    server_name _;

    access_log logs/default_access.log;
    error_log logs/default_error.log warn;

    return 404 '{"error":"invalid_host","hint":"use download.bmshub.asia"}';
}

server {
    listen 80;
    server_name download.bmshub.asia;

    access_log logs/download_access.log;
    error_log logs/download_error.log warn;

    client_max_body_size 2g;

    location / {
        proxy_pass http://appmanager_download_backend;
        proxy_http_version 1.1;

        # Some backends validate Host strictly; pass upstream host to avoid 403.
        proxy_set_header Host 172.18.38.179:6655;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_intercept_errors off;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        add_header X-Proxy-Upstream $upstream_addr always;
        add_header X-Proxy-Upstream-Status $upstream_status always;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
